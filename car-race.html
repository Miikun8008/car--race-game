<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カーレース</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      color: white;
      overflow: hidden;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #f5c518;
      text-shadow: 0 0 20px #f5c518;
      letter-spacing: 4px;
    }

    #info {
      display: flex;
      gap: 30px;
      margin-bottom: 10px;
      font-size: 1rem;
      font-weight: bold;
    }

    #info span {
      background: rgba(255,255,255,0.1);
      padding: 5px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    #info span.highlight {
      color: #f5c518;
      border-color: #f5c518;
    }

    #gameContainer {
      position: relative;
      width: 500px;
      height: 550px;
      overflow: hidden;
      border-radius: 12px;
      border: 3px solid #444;
      box-shadow: 0 0 40px rgba(245,197,24,0.2);
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #overlay h2 {
      font-size: 2.2rem;
      color: #f5c518;
      margin-bottom: 14px;
      text-shadow: 0 0 12px #f5c518;
    }

    #overlay p {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 8px;
      text-align: center;
    }

    #overlay .result {
      font-size: 1.4rem;
      font-weight: bold;
      margin: 10px 0;
    }

    #startBtn {
      margin-top: 20px;
      padding: 14px 42px;
      font-size: 1.2rem;
      font-weight: bold;
      background: linear-gradient(135deg, #f5c518, #e07b00);
      color: #1a1a2e;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 0 4px 18px rgba(245,197,24,0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    #startBtn:hover {
      transform: scale(1.07);
      box-shadow: 0 6px 28px rgba(245,197,24,0.8);
    }

    #controls {
      margin-top: 12px;
      display: flex;
      gap: 14px;
      font-size: 0.9rem;
      color: #aaa;
    }

    #controls kbd {
      background: #333;
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid #555;
      color: #fff;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>🏎 カーレース</h1>
  <div id="info">
    <span>スコア: <span id="scoreDisplay">0</span></span>
    <span class="highlight">最高: <span id="bestDisplay">0</span></span>
    <span>スピード: <span id="speedDisplay">1</span></span>
    <span>ライフ: <span id="livesDisplay">❤❤❤</span></span>
  </div>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="500" height="550"></canvas>
    <div id="overlay">
      <h2>🏁 カーレース</h2>
      <p>障害物を避けながら走り続けよう！</p>
      <p>← → キーで左右に移動</p>
      <button id="startBtn">スタート！</button>
    </div>
  </div>
  <div id="controls">
    <span><kbd>←</kbd><kbd>→</kbd> 移動</span>
    <span><kbd>↑</kbd> 加速</span>
    <span><kbd>↓</kbd> 減速</span>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const bestDisplay = document.getElementById('bestDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const livesDisplay = document.getElementById('livesDisplay');

    const W = canvas.width;
    const H = canvas.height;

    // ---- Road config ----
    const ROAD_LEFT = 60;
    const ROAD_RIGHT = 440;
    const ROAD_W = ROAD_RIGHT - ROAD_LEFT;
    const LANE_COUNT = 3;
    const LANE_W = ROAD_W / LANE_COUNT;

    // ---- Game state ----
    let state = 'idle'; // idle | playing | over
    let score = 0;
    let best = 0;
    let lives = 3;
    let baseSpeed = 4;
    let speed = baseSpeed;
    let frameCount = 0;
    let invincible = 0; // invincibility frames after hit
    let animId;

    // ---- Road lines ----
    const LINE_H = 60;
    const LINE_W = 10;
    let lineOffset = 0;

    // ---- Player car ----
    const player = {
      x: W / 2,
      y: H - 110,
      w: 44,
      h: 80,
      lane: 1,
      targetX: W / 2,
      color: '#e74c3c',
      wheelColor: '#222',
      windshield: '#87ceeb',
    };

    // ---- Enemy cars ----
    const ENEMY_COLORS = ['#3498db', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c'];
    let enemies = [];
    let enemyTimer = 0;
    let enemyInterval = 90;

    // ---- Particles ----
    let particles = [];

    // ---- Scenery ----
    let trees = [];
    for (let i = 0; i < 8; i++) {
      trees.push({ x: Math.random() < 0.5 ? 20 : W - 20, y: Math.random() * H, speed: 2 });
    }

    // ---- Keys ----
    const keys = {};
    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (state === 'playing') {
        if (e.key === 'ArrowLeft') moveLane(-1);
        if (e.key === 'ArrowRight') moveLane(1);
      }
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    function moveLane(dir) {
      const newLane = player.lane + dir;
      if (newLane < 0 || newLane >= LANE_COUNT) return;
      player.lane = newLane;
      player.targetX = ROAD_LEFT + LANE_W * player.lane + LANE_W / 2;
    }

    function laneX(lane) {
      return ROAD_LEFT + LANE_W * lane + LANE_W / 2;
    }

    startBtn.addEventListener('click', startGame);

    function startGame() {
      state = 'playing';
      score = 0;
      lives = 3;
      baseSpeed = 4;
      speed = baseSpeed;
      frameCount = 0;
      invincible = 0;
      enemies = [];
      particles = [];
      enemyTimer = 0;
      enemyInterval = 90;
      player.lane = 1;
      player.x = laneX(1);
      player.targetX = player.x;
      overlay.style.display = 'none';
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function spawnEnemy() {
      const lane = Math.floor(Math.random() * LANE_COUNT);
      const color = ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)];
      enemies.push({ x: laneX(lane), y: -90, w: 44, h: 80, lane, color, speed: speed * (0.7 + Math.random() * 0.6) });
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1.0,
          decay: 0.03 + Math.random() * 0.04,
          r: 4 + Math.random() * 5,
          color
        });
      }
    }

    function updateParticles() {
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= p.decay;
        p.r *= 0.97;
      });
    }

    function checkCollision(a, b) {
      const pad = 10;
      return Math.abs(a.x - b.x) < (a.w / 2 + b.w / 2 - pad)
          && Math.abs(a.y - b.y) < (a.h / 2 + b.h / 2 - pad);
    }

    function loop() {
      if (state !== 'playing') return;
      update();
      draw();
      animId = requestAnimationFrame(loop);
    }

    function update() {
      frameCount++;
      score++;

      // Speed control
      if (keys['ArrowUp']) speed = Math.min(baseSpeed * 2, speed + 0.08);
      else if (keys['ArrowDown']) speed = Math.max(1.5, speed - 0.08);
      else speed += (baseSpeed - speed) * 0.05;

      // Gradually increase base speed
      if (frameCount % 600 === 0) {
        baseSpeed = Math.min(14, baseSpeed + 0.5);
        enemyInterval = Math.max(40, enemyInterval - 5);
      }

      speedDisplay.textContent = Math.round(speed * 10);

      // Smooth player movement
      player.x += (player.targetX - player.x) * 0.18;

      // Road lines
      lineOffset = (lineOffset + speed) % LINE_H;

      // Trees
      trees.forEach(t => {
        t.y += speed * 0.6;
        if (t.y > H + 30) t.y = -30;
      });

      // Spawn enemies
      enemyTimer++;
      if (enemyTimer >= enemyInterval) {
        spawnEnemy();
        enemyTimer = 0;
      }

      // Update enemies
      enemies.forEach(e => {
        e.y += e.speed;
      });
      enemies = enemies.filter(e => e.y < H + 100);

      // Collision
      if (invincible <= 0) {
        for (let e of enemies) {
          if (checkCollision(player, e)) {
            lives--;
            invincible = 120;
            spawnParticles(player.x, player.y, '#ff4444');
            spawnParticles(e.x, e.y, e.color);
            enemies = enemies.filter(en => en !== e);
            if (lives <= 0) {
              gameOver();
              return;
            }
            break;
          }
        }
      } else {
        invincible--;
      }

      updateParticles();

      // Update HUD
      scoreDisplay.textContent = Math.floor(score / 10);
      livesDisplay.textContent = '❤'.repeat(lives) + '🖤'.repeat(3 - lives);
    }

    function gameOver() {
      state = 'over';
      const finalScore = Math.floor(score / 10);
      if (finalScore > best) best = finalScore;
      bestDisplay.textContent = best;
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <h2>💥 ゲームオーバー</h2>
        <p class="result" style="color:#f5c518">スコア: ${finalScore}</p>
        <p style="color:#aaa">最高スコア: ${best}</p>
        <button id="startBtn" onclick="document.getElementById('startBtn').blur(); window.replayGame()">
          もう一度！
        </button>
      `;
      document.getElementById('startBtn').addEventListener('click', startGame);
    }

    window.replayGame = startGame;

    // ---- Drawing ----
    function drawRoad() {
      // Background grass
      ctx.fillStyle = '#2d5a1b';
      ctx.fillRect(0, 0, W, H);

      // Road surface
      const grad = ctx.createLinearGradient(ROAD_LEFT, 0, ROAD_RIGHT, 0);
      grad.addColorStop(0, '#555');
      grad.addColorStop(0.5, '#666');
      grad.addColorStop(1, '#555');
      ctx.fillStyle = grad;
      ctx.fillRect(ROAD_LEFT, 0, ROAD_W, H);

      // Road edge lines
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(ROAD_LEFT, 0); ctx.lineTo(ROAD_LEFT, H);
      ctx.moveTo(ROAD_RIGHT, 0); ctx.lineTo(ROAD_RIGHT, H);
      ctx.stroke();

      // Center dashes
      ctx.setLineDash([LINE_H * 0.6, LINE_H * 0.4]);
      ctx.lineDashOffset = -lineOffset;
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 3;
      for (let i = 1; i < LANE_COUNT; i++) {
        const lx = ROAD_LEFT + LANE_W * i;
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, H);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function drawTree(x, y) {
      // Trunk
      ctx.fillStyle = '#7b4f2e';
      ctx.fillRect(x - 5, y, 10, 22);
      // Leaves
      ctx.fillStyle = '#1a7a1a';
      ctx.beginPath();
      ctx.arc(x, y, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#23a023';
      ctx.beginPath();
      ctx.arc(x - 4, y - 6, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCar(x, y, w, h, bodyColor, windshieldColor, flip) {
      const hw = w / 2;
      const hh = h / 2;

      // Shadow
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(x, y + hh - 5, hw * 0.9, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Body
      ctx.save();
      ctx.translate(x, y);
      if (flip) ctx.scale(1, -1);

      // Main body
      const bodyGrad = ctx.createLinearGradient(-hw, 0, hw, 0);
      bodyGrad.addColorStop(0, shadeColor(bodyColor, -20));
      bodyGrad.addColorStop(0.5, bodyColor);
      bodyGrad.addColorStop(1, shadeColor(bodyColor, -20));
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.roundRect(-hw, -hh + 18, w, h - 18, [6, 6, 12, 12]);
      ctx.fill();

      // Cabin
      ctx.fillStyle = shadeColor(bodyColor, -10);
      ctx.beginPath();
      ctx.roundRect(-hw + 7, -hh, w - 14, 40, [6, 6, 4, 4]);
      ctx.fill();

      // Windshield
      ctx.fillStyle = windshieldColor;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.roundRect(-hw + 11, -hh + 4, w - 22, 20, 4);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Headlights
      ctx.fillStyle = '#fffbe0';
      ctx.beginPath();
      ctx.roundRect(-hw + 5, -hh + 14, 12, 7, 3);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(hw - 17, -hh + 14, 12, 7, 3);
      ctx.fill();

      // Wheels
      const wheelPositions = [
        { wx: -hw + 2, wy: -hh + 22 },
        { wx: hw - 14, wy: -hh + 22 },
        { wx: -hw + 2, wy: hh - 30 },
        { wx: hw - 14, wy: hh - 30 },
      ];
      wheelPositions.forEach(({ wx, wy }) => {
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.roundRect(wx, wy, 12, 18, 4);
        ctx.fill();
        // Rim
        ctx.fillStyle = '#888';
        ctx.beginPath();
        ctx.arc(wx + 6, wy + 9, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function shadeColor(hex, amount) {
      let r = parseInt(hex.slice(1, 3), 16);
      let g = parseInt(hex.slice(3, 5), 16);
      let b = parseInt(hex.slice(5, 7), 16);
      r = Math.max(0, Math.min(255, r + amount));
      g = Math.max(0, Math.min(255, g + amount));
      b = Math.max(0, Math.min(255, b + amount));
      return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      drawRoad();

      // Trees
      trees.forEach(t => drawTree(t.x, t.y));

      // Enemy cars
      enemies.forEach(e => {
        drawCar(e.x, e.y, e.w, e.h, e.color, '#aaddff', false);
      });

      // Player car (flicker when invincible)
      if (invincible === 0 || Math.floor(invincible / 6) % 2 === 0) {
        drawCar(player.x, player.y, player.w, player.h, player.color, player.windshield, true);
      }

      drawParticles();

      // Speed lines when fast
      if (speed > baseSpeed * 1.4) {
        ctx.save();
        ctx.globalAlpha = (speed - baseSpeed * 1.4) / (baseSpeed * 0.6) * 0.25;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 12; i++) {
          const lx = ROAD_LEFT + 10 + Math.random() * (ROAD_W - 20);
          const ly = Math.random() * H;
          const len = 18 + Math.random() * 30;
          ctx.beginPath();
          ctx.moveTo(lx, ly);
          ctx.lineTo(lx, ly + len);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    // Initial draw
    draw();

    // Best score persistence
    const savedBest = localStorage.getItem('carRaceBest');
    if (savedBest) {
      best = parseInt(savedBest);
      bestDisplay.textContent = best;
    }
    window.addEventListener('beforeunload', () => {
      localStorage.setItem('carRaceBest', best);
    });
  </script>
</body>
</html>
